services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loanflow
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: loanflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanflow -d loanflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  external-service:
    build: ./external-service
    environment:
      FAILURE_RATE: ${FAILURE_RATE:-0}
    ports:
      - "4000:4000"

volumes:
  postgres-data:
