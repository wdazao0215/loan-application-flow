services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loanflow
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: loanflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanflow -d loanflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  external-service:
    build: ./external-service
    environment:
      FAILURE_RATE: ${FAILURE_RATE:-0}
    ports:
      - "4000:4000"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__LoanFlow: Host=postgres;Port=5432;Database=loanflow;Username=loanflow;Password=loanflow;GSS Encryption Mode=Disable
      ExternalService__BaseUrl: http://external-service:4000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      external-service:
        condition: service_started

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
